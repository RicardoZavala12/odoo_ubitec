# ===== Odoo 18 UBITEC — PRODUCCIÓN =====
# Compatible con docker-compose v1.29 (Contabo). El nombre del proyecto se
# pasa con -p ubitec-prod (ver scripts). Puertos 8090 web / 5440 db.
# NUNCA levantar junto con dev. Traccar NO se toca.
version: "3.3"

services:
  db:
    image: postgres:17
    container_name: ubitec-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_ubitec_pass
      POSTGRES_DB: postgres
    ports:
      - "5440:5432"
    volumes:
      - ubitec_prod_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:18.0
    container_name: ubitec-prod-odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:8069"
    volumes:
      - ubitec_prod_odoo:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo_ubitec_pass

volumes:
  ubitec_prod_db:
  ubitec_prod_odoo:
