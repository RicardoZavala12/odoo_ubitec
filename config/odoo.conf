[options]
; ===== Config Odoo 18 - UBITEC =====
; Contraseña maestra para crear/eliminar/respaldar bases de datos desde la UI.
; CAMBIAR por una segura antes de produccion.
admin_passwd = ubitec_admin_2026

; Conexion a la BD (apunta al servicio 'db' del docker-compose)
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo_ubitec_pass

; Ruta de modulos: nuestros customs (/mnt/extra-addons) + repos OCA clonados.
; Cada repo OCA es una carpeta con muchos modulos, por eso se listan aparte.
addons_path = /mnt/extra-addons,/mnt/extra-addons/oca_contract,/mnt/extra-addons/oca_field_service,/mnt/extra-addons/oca_helpdesk,/mnt/extra-addons/oca_web

; Mostrar solo la BD de ubitec (evita ver/tocar otras bases por error)
dbfilter = ^ubitec$

; Logs
logfile =
log_level = info

; Dev: 0 workers = modo single-thread, ideal para desarrollo local
workers = 0
max_cron_threads = 1
